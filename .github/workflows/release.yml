name: Release gwt

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Build gwt-bin
        run: |
          go build -o gwt-bin

      - name: Prepare distribution
        run: |
          mkdir dist
          cp gwt-bin dist/
          cp -r shell dist/

      - name: Create tar.gz
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          cd dist
          tar czf ../gwt-${TAG}.tar.gz *

      - name: Create GitHub Release
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          gh release create "${TAG}" \
            "gwt-${TAG}.tar.gz" \
            --title "${TAG}" \
            --generate-notes

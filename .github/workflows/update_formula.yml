name: Update Formula

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Download gwt release tar.gz
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          gh release download $TAG --pattern "gwt-${TAG}.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sha256
        id: sha
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          SHA256=$(shasum -a 256 gwt-${TAG}.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update gwt.rb
        run: |
          FORMULA="Formula/gwt.rb"
          TAG=${GITHUB_REF_NAME#refs/tags/}
          SHA=${{ steps.sha.outputs.sha256 }}
          sed -i'' -e "s|url \".*\"|url \"https://github.com/tdrk18/homebrew-gwt/releases/download/${TAG}/gwt-${TAG}.tar.gz\"|" $FORMULA
          sed -i'' -e "s|sha256 \".*\"|sha256 \"$SHA\"|" $FORMULA

      - name: Commit and create PR
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="update-formula-${TAG}"
          git switch -c "${BRANCH}"
          git add Formula/gwt.rb
          git commit -m "Update gwt.rb for ${TAG}" || echo "No changes"
          git push https://x-access-token:${GH_TOKEN}@github.com/tdrk18/homebrew-gwt.git HEAD:${BRANCH}
          gh pr create \
            --title "Update gwt.rb for ${TAG}" \
            --body "Automated update of gwt formula for release ${TAG}" \
            --head "${BRANCH}" \
            --base "main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Formula
        run: brew audit --strict Formula/gwt.rb || true
